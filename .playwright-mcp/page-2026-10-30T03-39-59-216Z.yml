      - generic [ref=f10e70]:
        - paragraph [ref=f10e71]: 📋 Admission Requirements
        - generic [ref=f10e72]:
          - generic [ref=f10e73] [cursor=pointer]: What documents do I need to submit?
          - paragraph [ref=f10e78]: "You need to submit: (1) Original Form 138 / Report Card, (2) PSA Birth Certificate, (3) Certificate of Good Moral Character, (4) 2x2 ID photo, and (5) Accomplished application form. Additional documents may be required depending on your applicant type."
        - generic [ref=f10e79]:
          - generic [ref=f10e80] [cursor=pointer]: What are the requirements for transferees?
          - paragraph [ref=f10e85]: "Transferees must submit: Transcript of Records (TOR) or True Copy of Grades, Certificate of Transfer Credential (Honorable Dismissal), and all standard admission requirements. A validation exam may also be required."
        - paragraph [ref=f10e86]: 🎓 Programs Offered
        - generic [ref=f10e87]:
          - generic [ref=f10e88] [cursor=pointer]: What programs are available for enrollment?
          - paragraph [ref=f10e93]: The school offers programs across various colleges. Please check with the Registrar or Admissions Office for the complete and updated list of programs currently open for enrollment.
        - paragraph [ref=f10e94]: 📅 Application Process
        - generic [ref=f10e95]:
          - generic [ref=f10e96] [cursor=pointer]: How does the application process work?
          - paragraph [ref=f10e101]: "The process is: (1) Create an account and fill out the online application form, (2) Submit required documents, (3) Pay the admission processing fee, (4) Take the entrance exam (if applicable), (5) Await results and enrollment schedule."
        - generic [ref=f10e102]:
          - generic [ref=f10e103] [cursor=pointer]: When is the application deadline?
          - paragraph [ref=f10e108]: Application deadlines vary per semester. Please monitor announcements on the portal or contact the Admissions Office directly for the latest schedule.
        - paragraph [ref=f10e109]: 💰 Tuition & Fees
        - generic [ref=f10e110]:
          - generic [ref=f10e111] [cursor=pointer]: How much is the admission processing fee?
          - paragraph [ref=f10e116]: The admission processing fee varies by program. Please check the Payments section of the portal or contact the Cashier's Office for the exact amount.
        - generic [ref=f10e117]:
          - generic [ref=f10e118] [cursor=pointer]: Are there available scholarships?
          - paragraph [ref=f10e123]: Yes, scholarships are available including academic, athletic, and financial assistance grants. Contact the Scholarship Office or Student Affairs for eligibility details.
