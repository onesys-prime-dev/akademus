# Shared deployment logic, called by deploy-staging.yml and deploy-production.yml AFTER the CI gate
# passed for the same commit. See docs/CI-CD.md.
#
# Uses the GitHub Environment's secrets (VPS_HOST, VPS_USERNAME, VPS_PRIVATE_KEY, VPS_KNOWN_HOSTS) and
# variables (DEPLOY_PATH, PHP_BIN, SITE_URL, SSH_PORT, TLS_INSECURE). GITLEAKS_LICENSE is not needed
# (CI runs the Gitleaks CLI, which needs no license).
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (staging | production).
        type: string
        required: true
      sha:
        description: Exact commit to deploy (must be the commit CI passed for).
        type: string
        required: true
      release-label:
        description: Human label for the summary (e.g. the tag v1.4.0).
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.bundle.outputs.name }}
      php-version: ${{ steps.php.outputs.php-version }}
    steps:
      - name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$ENVIRONMENT" =~ ^(staging|production)$ ]] || { echo "::error::Unknown environment '$ENVIRONMENT'"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Checked-out commit is the requested commit
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$(git rev-parse HEAD)" == "$SHA" ]] || { echo "::error::Checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }'

      - name: Production dependencies (no dev packages, authoritative classmap)
        id: php
        uses: ./.github/actions/setup-app
        with:
          composer-flags: --no-dev --classmap-authoritative --no-scripts
          # Clean build: never restore or save the shared Composer cache for a release bundle.
          cache: 'false'

      - name: Build bundle
        id: bundle
        env:
          SHA: ${{ inputs.sha }}
          LABEL: ${{ inputs.release-label }}
        run: |
          echo "$SHA" > REVISION
          printf '%s\n' "${LABEL:-$SHA}" > RELEASE
          name="akademus-${SHA:0:12}.tar.gz"
          tar --exclude-from=deploy/bundle-exclude.txt -czf "$RUNNER_TEMP/$name" .
          ( cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256" )

          # Guard: nothing sensitive or mutable may ship.
          if tar -tzf "$RUNNER_TEMP/$name" | grep -E '(^|/)\.env($|\.)|^\./writable/|^\./\.git/|^\./tests/|^\./node_modules/'; then
            echo "::error::The bundle contains files that must never be deployed (listed above)"; exit 1
          fi
          tar -tzf "$RUNNER_TEMP/$name" | grep -qx './vendor/autoload.php' || { echo "::error::vendor/ missing from bundle"; exit 1; }

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Bundle $name: $(du -h "$RUNNER_TEMP/$name" | cut -f1), $(tar -tzf "$RUNNER_TEMP/$name" | wc -l) entries"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.environment }}-${{ inputs.sha }}
          path: |
            ${{ runner.temp }}/${{ steps.bundle.outputs.name }}
            ${{ runner.temp }}/${{ steps.bundle.outputs.name }}.sha256
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.sha }}
      BUNDLE: ${{ needs.build.outputs.bundle }}
      EXPECTED_PHP: ${{ needs.build.outputs.php-version }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PHP_BIN: ${{ vars.PHP_BIN }}
      SITE_URL: ${{ vars.SITE_URL }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      TLS_INSECURE: ${{ vars.TLS_INSECURE }}
    steps:
      - name: Check environment configuration
        env:
          HAS_HOST: ${{ secrets.VPS_HOST != '' }}
          HAS_USER: ${{ secrets.VPS_USERNAME != '' }}
          HAS_KEY: ${{ secrets.VPS_PRIVATE_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS != '' }}
        run: |
          missing=()
          [[ "$HAS_HOST" == "true" ]] || missing+=("secret VPS_HOST")
          [[ "$HAS_USER" == "true" ]] || missing+=("secret VPS_USERNAME")
          [[ "$HAS_KEY" == "true" ]] || missing+=("secret VPS_PRIVATE_KEY")
          [[ "$HAS_KNOWN_HOSTS" == "true" ]] || missing+=("secret VPS_KNOWN_HOSTS")
          for v in DEPLOY_PATH PHP_BIN SITE_URL; do [[ -n "${!v}" ]] || missing+=("variable $v"); done
          if (( ${#missing[@]} )); then echo "::error::Environment '$ENVIRONMENT' is missing: ${missing[*]}"; exit 1; fi
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != "/" ]] || { echo "::error::DEPLOY_PATH must be absolute and not /"; exit 1; }
          [[ -z "$SSH_PORT" || "$SSH_PORT" =~ ^[0-9]+$ ]] || { echo "::error::SSH_PORT must be a number"; exit 1; }
          [[ -z "$TLS_INSECURE" || "$TLS_INSECURE" =~ ^(true|false)$ ]] || { echo "::error::TLS_INSECURE must be true or false"; exit 1; }
          if [[ "$ENVIRONMENT" == "production" && "$TLS_INSECURE" == "true" ]]; then
            echo "::error::TLS_INSECURE=true is not allowed for production"; exit 1
          fi
          [[ "$SITE_URL" =~ ^https?:// ]] || { echo "::error::SITE_URL must start with http:// or https://"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: deploy/remote-deploy.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.environment }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify bundle checksum
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c "$BUNDLE.sha256"

      - name: Configure SSH (strict host key checking)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$d/known_hosts"
          cat > "$d/config" <<EOF
          Host deploy-target
            HostName ${VPS_HOST}
            User ${VPS_USERNAME}
            Port ${SSH_PORT:-22}
            IdentityFile ${d}/key
            IdentitiesOnly yes
            UserKnownHostsFile ${d}/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          echo "SSH_OPTS=-F $d/config" >> "$GITHUB_ENV"

      - name: Upload bundle
        working-directory: ${{ runner.temp }}/release
        run: |
          # Retry only connection failures (ssh/scp exit code 255).
          retry() { local n; for n in 1 2 3; do "$@" && return 0; rc=$?; [[ $rc -eq 255 ]] || return $rc; echo "connection failed (attempt $n), retrying..."; sleep $((n * 10)); done; return 255; }
          # shellcheck disable=SC2086
          retry ssh $SSH_OPTS deploy-target "mkdir -p '$DEPLOY_PATH/incoming'"
          # shellcheck disable=SC2086
          retry scp $SSH_OPTS -q "$BUNDLE" "$BUNDLE.sha256" "deploy-target:$DEPLOY_PATH/incoming/"

      - name: Deploy on the server (deploy/remote-deploy.sh)
        run: |
          # shellcheck disable=SC2086
          ssh $SSH_OPTS deploy-target bash -s -- \
            "$(printf '%q' "$ENVIRONMENT")" "$(printf '%q' "$SHA")" "$(printf '%q' "$DEPLOY_PATH")" \
            "$(printf '%q' "$PHP_BIN")" "$(printf '%q' "$SITE_URL")" "$(printf '%q' "${TLS_INSECURE:-false}")" \
            "$(printf '%q' "$EXPECTED_PHP")" "$(printf '%q' "$BUNDLE")" \
            < deploy/remote-deploy.sh

      - name: Verify from outside (GitHub runner -> SITE_URL/health)
        run: |
          tls=(); [[ "$TLS_INSECURE" == "true" ]] && tls=(--insecure)
          for _ in $(seq 1 6); do
            body=$(curl -sS --max-time 10 "${tls[@]}" "${SITE_URL%/}/health" || true)
            if [[ "$(jq -r .status <<<"$body" 2>/dev/null)" == "ok" && "$(jq -r .release <<<"$body" 2>/dev/null)" == "$SHA" ]]; then
              echo "$SITE_URL serves $SHA and is healthy."; exit 0
            fi
            sleep 10
          done
          echo "::error::External health check failed: $body"; exit 1

      - name: Summary
        if: always()
        env:
          LABEL: ${{ inputs.release-label }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Deploy to \`$ENVIRONMENT\`: $OUTCOME"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            [[ -n "$LABEL" ]] && echo "| Release | \`$LABEL\` |"
            echo "| URL | $SITE_URL |"
            echo "| PHP | $EXPECTED_PHP |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
