name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: ⚙️ Create .env for CI
        run: |
          cp env .env

          cat >> .env <<EOF
          CI_ENVIRONMENT = testing
          app.baseURL = 'http://localhost/'
          EOF

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: 🔍 Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config <<EOF
          Host *
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

      - name: 🚀 Deploy
        run: |
          for i in 1 2 3 4 5; do
            echo "SSH deploy attempt $i..."

            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash ~/deploy.sh production" && exit 0
            elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
              ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash ~/deploy.sh testing" && exit 0
            fi

            echo "SSH failed. Retrying in 20 seconds..."
            sleep 20
          done

          echo "Deploy failed after 5 SSH attempts."
          exit 1